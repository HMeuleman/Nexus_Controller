type: custom:apexcharts-card
update_interval: 5min
all_series_config:
  group_by:
    duration: 15min
    func: avg
    fill: last
header:
  show: true
  title: Voorspelling versus actueel (afgelopen 48 uur)
graph_span: 48h
now:
  show: true
apex_config:
  xaxis:
    tooltip:
      enabled: false
  tooltip:
    shared: true
    intersect: false
    fixed:
      enabled: true
    x:
      format: HH:mm (dd MMM)
      show: true
  chart:
    height: 350
    zoom:
      enabled: true
      type: x
    toolbar:
      show: true
      tools:
        zoom: true
        zoomin: true
        zoomout: true
        pan: true
        reset: true
yaxis:
  - id: power
    min: 0
    decimals: 0
    align_to: 1000
    show: true
    apex_config:
      title:
        text: W
series:
  - entity: sensor.electricity_house
    name: Actueel Huis (W)
    yaxis_id: power
    transform: return parseFloat(x) * 1000;
    unit: W
    type: area
    color: '#236e4c'
    stroke_width: 2
    opacity: 0.6
    show:
      legend_value: false
    statistics:
      type: mean
      period: 5minute
  - entity: sensor.kelder_nexus_controller_verbruiksverwachting_nu
    name: Voorspelling Huis (W)
    yaxis_id: power
    unit: W
    type: line
    color: yellow
    stroke_width: 2
    curve: stepline
    show:
      legend_value: false
  - entity: sensor.kelder_nexus_controller_zonne_opbrengstverwachting_nu
    name: Voorspelling Solar (W)
    yaxis_id: power
    unit: W
    type: line
    color: orange
    stroke_width: 2
    curve: stepline
    show:
      legend_value: false
    statistics:
      type: mean
      period: 5minute
  - entity: sensor.kelder_nexus_controller_zonne_opbrengstverwachting_ml_nu
    name: ML voorspeld (W)
    yaxis_id: power
    unit: W
    type: line
    color: '#2b6cb0'
    stroke_width: 2
    curve: stepline
    float_precision: 0
    show:
      legend_value: false
    statistics:
      type: mean
      period: 5minute
  - entity: sensor.nexus_controller_zonneproductie
    name: Actueel Solar (W)
    yaxis_id: power
    unit: W
    type: line
    color: red
    stroke_width: 1
    curve: stepline
    float_precision: 0
    show:
      legend_value: false
