type: custom:apexcharts-card
update_interval: 5min
all_series_config:
  group_by:
    duration: 15min
    func: avg
    fill: last
header:
  show: true
  title: Gebruiks voorspeller (huis en WP) in W
  show_states: true
apex_config:
  xaxis:
    tooltip:
      enabled: false
  tooltip:
    shared: true
    intersect: false
    fixed:
      enabled: true
    x:
      format: HH:mm (dd MMM)
      show: true
  chart:
    zoom:
      enabled: true
      type: x
    toolbar:
      show: true
      tools:
        zoom: true
        zoomin: true
        zoomout: true
        pan: true
        reset: true
graph_span: 24h
span:
  start: minute
now:
  show: true
yaxis:
  - id: power
    min: 0
    decimals: 0
    align_to: 1000
    apex_config:
      title:
        text: W
  - id: temperature
    opposite: true
    decimals: 1
    apex_config:
      title:
        text: Celsius
series:
  - entity: sensor.kelder_nexus_controller_warmtepompverwachting_komende_24_uur
    float_precision: 0
    name: Huis verbruik
    show:
      in_header: after_now
      name_in_header: true
      legend_value: false
    yaxis_id: power
    unit: W
    type: line
    color: '#236e4c'
    stroke_width: 3
    curve: stepline
    data_generator: |
      return (entity.attributes.slots || []).map(slot =>
        [new Date(slot.start).getTime(), slot.total_w]);
  - entity: sensor.kelder_nexus_controller_warmtepompverwachting_komende_24_uur
    float_precision: 0
    name: Huis verbruik - WP
    show:
      in_header: false
      name_in_header: true
      legend_value: false
    yaxis_id: power
    unit: W
    type: line
    color: '#4e789f'
    stroke_width: 2
    curve: stepline
    data_generator: |
      return (entity.attributes.slots || []).map(slot =>
        [new Date(slot.start).getTime(), slot.baseline_w]);
  - entity: sensor.kelder_nexus_controller_warmtepompverwachting_komende_24_uur
    float_precision: 0
    name: Warmtepomp
    show:
      in_header: after_now
      name_in_header: true
      legend_value: false
    yaxis_id: power
    unit: W
    type: line
    color: '#c48928'
    stroke_width: 2
    curve: stepline
    data_generator: |
      return (entity.attributes.slots || []).map(slot =>
        [new Date(slot.start).getTime(), slot.heatpump_w]);
  - entity: sensor.kelder_nexus_controller_warmtepompverwachting_komende_24_uur
    name: Buiten temperatuur
    show:
      in_header: after_now
      name_in_header: false
      legend_value: false
    yaxis_id: temperature
    unit: °C
    type: line
    color: '#b04f65'
    stroke_width: 1
    data_generator: |
      return (entity.attributes.slots || []).map(slot =>
        [new Date(slot.start).getTime(), slot.temperature_c]);
  - entity: sensor.kelder_nexus_controller_zonne_opbrengstverwachting_komende_24_uur
    name: Zonne energie
    show:
      in_header: after_now
      name_in_header: false
      legend_value: false
    yaxis_id: power
    unit: W
    type: line
    color: yellow
    stroke_width: 1
    curve: stepline
    data_generator: |
      return (entity.attributes.slots || [])
        .filter(slot => slot.pv_w != null)
        .map(slot => [new Date(slot.start).getTime(), slot.pv_w]);
  - entity: sensor.solar_forecast_ml_rest_of_day
    name: ML
    show:
      in_header: after_now
      name_in_header: false
      legend_value: false
    yaxis_id: power
    unit: W
    type: line
    color: red
    stroke_width: 1
    data_generator: >
      const out = [];

      const d = new Date();

      const pushDay = (hours, dayOffset) => {
        for (const [label, kwh] of Object.entries(hours || {})) {
          const h = Number(label.split(':')[0]);
          const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() + dayOffset, h);
          for (let q = 0; q < 4; q++) out.push([start.getTime() + q * 900000, kwh * 1000]);
        }
      };

      pushDay(entity.attributes.hourly_forecast, 0);

      pushDay(hass.states['sensor.solar_forecast_ml_forecast_tomorrow'].attributes.hours,
      1);

      return out.filter(([t]) => t >= Date.now() - 900000);
