type: custom:apexcharts-card
apex_config:
  chart:
    zoom:
      enabled: true
      type: x
    toolbar:
      show: true
      tools:
        zoom: true
        zoomin: true
        zoomout: true
        pan: true
        reset: true
header:
  show: true
  title: Kwartierplan (W, + = ontladen, − = laden)
graph_span: 48h
span:
  start: hour
now:
  show: true
yaxis:
  - id: power
    decimals: 0
    align_to: 1000
    apex_config:
      title:
        text: W
series:
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: NOM ontladen
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 3
    color: '#c0392b'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.action === 'nom_discharge' ? s.power_w : 0;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: Ontladen (export x)
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 2
    color: '#e67e22'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.action === 'discharge' ? s.power_w : 0;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: NOM laden (zonne-overschot)
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 3
    color: '#1e8449'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.action === 'nom_charge' ? s.power_w : 0;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: Laden uit net (x)
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 2
    color: '#2471a3'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.action === 'charge' ? s.power_w : 0;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: Voorspeld huisverbruik (NOM-cap)
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 2
    color: '#7f8c8d'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.demand_forecast_w ?? null;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
  - entity: sensor.kelder_nexus_controller_experimenteel_kwartierplan
    name: Voorspeld zonne-overschot
    yaxis_id: power
    unit: W
    type: line
    curve: stepline
    stroke_width: 1
    color: '#b7950b'
    extend_to: false
    data_generator: |
      return (entity.attributes.slots || []).flatMap(s => {
        const t = new Date(s.start).getTime();
        const v = s.surplus_forecast_w ?? null;
        return [[t, v], [t + s.duration_hours * 3600000 - 1, v]];
      });
